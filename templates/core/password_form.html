{% extends 'core/base.html' %}

{% block title %}
    Password Protected - {{ post.title }}
{% endblock %}

{% block content %}
<div class="password-form-container">
    <div class="password-form-card">
        <h2 class="form-title">This Post is Protected</h2>
        <p class="form-message">
            Please enter the password to view the content.
        </p>

        {% if error %}
            <p class="text-danger error-message">{{ error }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="{{ form.password.id_for_label }}">Password</label>
                {{ form.password }}
            </div>
            <button type="submit" class="submit-btn">
                Unlock Post
            </button>
        </form>
    </div>
</div>

<style>
/* Add some basic styling for a clean look */
.password-form-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    padding: 20px;
}
.password-form-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 15px;
    padding: 2rem;
    box-shadow: 0 10px 30px var(--shadow);
    max-width: 500px;
    width: 100%;
    text-align: center;
}
.form-title {
    color: var(--primary);
    font-weight: 700;
    margin-bottom: 1rem;
}
.form-message {
    color: var(--text-dim);
    margin-bottom: 2rem;
}
.error-message {
    margin-top: 1rem;
}
.form-group label {
    display: none;
}
.form-group input {
    width: 100%;
    padding: 1rem;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--dark-bg);
    color: var(--text);
    margin-bottom: 1.5rem;
}
.submit-btn {
    width: 100%;
    padding: 1rem;
    font-size: 1.1rem;
    font-weight: 600;
    background: linear-gradient(135deg, var(--primary), var(--primary-hover));
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
}
.submit-btn:hover {
    box-shadow: 0 8px 25px var(--glow);
    transform: translateY(-2px);
}
</style>
{% endblock content %}
