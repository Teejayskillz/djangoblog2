<style>
/* ---------------- Root Colors ---------------- */
:root {
    --dark-bg: #1A1A1A;
    --darker-bg: #0F0F0F;
    --card-bg: #27344D;
    --primary: #008080;
    --primary-hover: #00A3A3;
    --text: #E0E0E0;
    --text-muted: #A0A0A0;
    --text-dim: #707070;
    --border-color: #3F516C;
    --shadow: rgba(0,0,0,0.6);
    --glow: rgba(0,128,128,0.4);
}

/* ---------------- Header ---------------- */
.header-gradient {
    background: rgba(39, 52, 77, 0.35);
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px var(--shadow);
    border-bottom: 3px solid var(--primary);
    position: relative;
    overflow: hidden;
}

.header-gradient::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(45deg, transparent 0%, rgba(0,128,128,0.05) 50%, transparent 100%);
    pointer-events: none;
}

/* ---------------- Logo & Tagline ---------------- */
.logo-brand {
    font-family: 'Arial Black', sans-serif;
    font-weight: 900;
    font-size: 2.5rem;
    background: linear-gradient(45deg, var(--primary), var(--primary-hover));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 15px var(--glow);
    transition: all 0.3s ease;
}

.logo-brand:hover {
    transform: scale(1.05);
    filter: drop-shadow(0 0 12px rgba(0,128,128,0.6));
}

.tagline {
    color: var(--text-muted);
    font-size: 0.9rem;
    font-weight: 300;
    margin-top: 2px;
}

/* ---------------- Search ---------------- */
.search-container {
    position: relative;
    flex: 1;
    max-width: 500px;
}

.search-input {
    background: rgba(15,15,15,0.5);
    backdrop-filter: blur(5px);
    border: 2px solid var(--border-color);
    border-radius: 25px 0 0 25px;
    padding: 12px 20px;
    color: var(--text);
    width: 100%;
    transition: all 0.3s ease;
}

.search-input:focus {
    background: rgba(26,26,26,0.7);
    border-color: var(--primary);
    box-shadow: 0 0 15px var(--glow);
    outline: none;
}

.search-input::placeholder {
    color: var(--text-dim);
}

.search-btn {
    border: none;
    border-radius: 0 25px 25px 0;
    padding: 12px 20px;
    background: linear-gradient(45deg, var(--primary), var(--primary-hover));
    color: white;
    transition: all 0.3s ease;
}

.search-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 12px var(--glow);
}

/* ---------------- Admin & Telegram Buttons ---------------- */
.admin-btn {
    background: rgba(15,15,15,0.5);
    backdrop-filter: blur(5px);
    border: 2px solid var(--border-color);
    border-radius: 20px;
    padding: 8px 16px;
    font-weight: 500;
    color: var(--text);
    transition: all 0.3s ease;
}
.admin-btn:hover {
    background: var(--border-color);
    transform: translateY(-1px);
    box-shadow: 0 3px 10px var(--shadow);
}

.telegram-btn {
    background: linear-gradient(45deg, var(--primary), var(--primary-hover));
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    font-weight: 600;
    transition: all 0.3s ease;
}
.telegram-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 15px var(--glow);
}

/* ---------------- Category Nav ---------------- */
.category-nav {
    background: rgba(15,15,15,0.3);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border-color);
    padding: 12px 0;
}

.category-btn {
    background: transparent;
    border: 1px solid var(--border-color);
    border-radius: 25px;
    padding: 10px 20px;
    color: var(--text-muted);
    font-weight: 500;
    position: relative;
    overflow: hidden;
    margin: 4px;
    transition: all 0.3s ease;
}

.category-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 100%;
    background: linear-gradient(45deg, var(--primary), var(--primary-hover));
    transition: width 0.3s ease;
    z-index: -1;
}

.category-btn:hover {
    color: #fff;
    border-color: var(--primary);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px var(--glow);
}

.category-btn:hover::before {
    width: 100%;
}

/* ---------------- Header Layout ---------------- */
.header-content {
    display: flex;
    align-items: center;
    gap: 20px;
}

@media (max-width: 992px) {
    .header-content {
        flex-direction: column;
        gap: 15px;
    }
    .logo-brand { font-size: 2rem; }
    .search-container { width: 100%; }
}
</style>

<header class="header-gradient p-3 mb-4">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center header-content">
      <!-- Logo Section -->
      <div class="logo-section text-center text-lg-start">
        <h1 class="m-0">
          <a href="{% url 'home' %}" class="logo-brand text-decoration-none">NZDWORLD</a>
        </h1>
        <small class="tagline">Movies Update & Everything Nice</small>
      </div>

      <!-- Search -->
      <div class="search-container">
        <form action="{% url 'search' %}" method="get">
          <div class="input-group">
            <input type="text" name="q" class="form-control search-input" placeholder="Search movies, series..." aria-label="Search">
            <button class="btn search-btn" type="submit"><i class="bi bi-search"></i></button>
          </div>
        </form>
      </div>

      <!-- Admin & Telegram -->
      <div class="admin-controls d-flex gap-2 justify-content-center">
        {% if user.is_staff %}
        <a href="{% url 'admin:index' %}" class="btn admin-btn"><i class="bi bi-gear-fill me-1"></i>Admin</a>
        {% endif %}
        <a href="https://t.me/nzdworldhub" class="btn telegram-btn text-white"><i class="bi bi-send-fill me-1"></i>Telegram</a>
      </div>
    </div>
  </div>

  <!-- Category Navigation -->
  <nav class="category-nav mt-3">
    <div class="container">
      <div class="d-flex flex-wrap justify-content-center gap-2">
        <a href="{% url 'category' 'hollywood-movie' %}" class="btn category-btn"><i class="bi bi-film me-1"></i>Hollywood</a>
        <a href="{% url 'category' 'nollywood-movie' %}" class="btn category-btn"><i class="bi bi-camera-reels me-1"></i>Nollywood</a>
        <a href="{% url 'category' 'series' %}" class="btn category-btn"><i class="bi bi-camera-reels me-1"></i>Series</a>
        <a href="{% url 'category' 'korean-drama' %}" class="btn category-btn"><i class="bi bi-heart-fill me-1"></i>Korean Drama</a>
        <a href="{% url 'category' 'indian-Movie' %}" class="btn category-btn"><i class="bi bi-globe-asia-australia me-1"></i>Bollywood</a>
        <a href="{% url 'category' 'animation' %}" class="btn category-btn"><i class="bi bi-lightning-fill me-1"></i>Animation</a>
      </div>
    </div>
  </nav>
</header>
