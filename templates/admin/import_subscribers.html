{% extends 'admin/base_site.html' %}
{% load i18n admin_urls static %}

{% block content %}
<div id="content-main">
    <h1>Import Subscribers</h1>
    <p>Please upload a CSV file with one email address per line.</p>
    <form action="." method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-row field-csv_file">
            <div>
                <label class="required" for="id_csv_file">CSV file:</label>
                <input type="file" name="csv_file" required id="id_csv_file">
            </div>
        </div>
        <div class="submit-row">
            <input type="submit" value="Import" class="default">
        </div>
    </form>
</div>
{% endblock %}
