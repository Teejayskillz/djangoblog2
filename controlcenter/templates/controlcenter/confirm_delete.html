{% extends 'controlcenter/base.html' %}
{% block title %}Delete {{ model._meta.verbose_name }}{% endblock %}
{% block content %}
<h2>Delete {{ model._meta.verbose_name }}</h2>
<p>Are you sure you want to delete <strong>{{ object }}</strong>?</p>
<form method="post">
  {% csrf_token %}
  <button class="btn" type="submit">Yes, delete</button>
  <a class="btn" href="{% url 'controlcenter:model_list' app_label=model._meta.app_label model_name=model._meta.model_name %}">Cancel</a>
</form>
{% endblock %}
